<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="color-scheme" content="light dark">
<style>:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-size:14px;font-family:system-ui,sans-serif}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>Discipline Gym</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&family=Unbounded:wght@500;700&display=swap">
<style>
/* Layout: one narrow phone column, tabs pinned to the bottom, workout opens full screen like a gym timer. */
:root{
  --bg:#EDF1EF; --surface:#FFFFFF; --surface2:#E1E8E4; --ink:#13201A; --muted:#58695F; --line:#CED8D3;
  --accent:#1E58D6; --accent-soft:#DCE6FB; --accent-ink:#FFFFFF; --energy:#D99600; --energy-soft:#FBEFD2;
  --good:#1C8650; --good-soft:#DBF0E3; --bad:#C23E2B; --bad-soft:#F8E0DB;
  --fig:#13201A; --fig2:#A4B2AB;
  --f-display:"Unbounded", "Arial Black", system-ui, sans-serif;
  --f-body:"Manrope", system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){ :root:not([data-theme="light"]){
  --bg:#0D1311; --surface:#161F1B; --surface2:#202B26; --ink:#E7EEEA; --muted:#93A39A; --line:#2B3732;
  --accent:#7398FF; --accent-soft:#1D2A4A; --accent-ink:#0A1022; --energy:#FFC23A; --energy-soft:#3A2E10;
  --good:#4FC587; --good-soft:#15301F; --bad:#FF7B64; --bad-soft:#3A1A14;
  --fig:#E7EEEA; --fig2:#4D5C55; color-scheme:dark }}
:root[data-theme="dark"]{
  --bg:#0D1311; --surface:#161F1B; --surface2:#202B26; --ink:#E7EEEA; --muted:#93A39A; --line:#2B3732;
  --accent:#7398FF; --accent-soft:#1D2A4A; --accent-ink:#0A1022; --energy:#FFC23A; --energy-soft:#3A2E10;
  --good:#4FC587; --good-soft:#15301F; --bad:#FF7B64; --bad-soft:#3A1A14;
  --fig:#E7EEEA; --fig2:#4D5C55; color-scheme:dark }

*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{background:var(--bg)}
body{color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.45;-webkit-tap-highlight-color:transparent}
.wrap{max-width:560px;margin:0 auto;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.top{padding-block:18px 6px;display:flex;align-items:flex-end;justify-content:space-between;gap:12px}
.brand{font-family:var(--f-display);font-weight:700;font-size:20px;letter-spacing:-.01em}
.brand small{display:block;font-family:var(--f-body);font-weight:600;font-size:12px;color:var(--muted);letter-spacing:.06em;text-transform:uppercase;margin-bottom:2px}
.date{font-size:13px;color:var(--muted);text-align:right}
main{padding-bottom:110px}
h2{font-family:var(--f-display);font-weight:700;font-size:17px;margin:0;text-wrap:balance}
h3{font-size:15px;font-weight:800;margin:0}
p{margin:0}
.stack{display:flex;flex-direction:column;gap:12px}
.section-label{font-size:12px;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:var(--muted);margin:14px 2px 0}
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:10px;min-width:0}
.card.hero{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.card.hero .muted{color:color-mix(in srgb, var(--bg) 70%, transparent)}
.muted{color:var(--muted)}
.small{font-size:13px}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.row.between{justify-content:space-between}
.grow{flex:1;min-width:0}
.btn{appearance:none;border:0;border-radius:12px;padding:12px 16px;font:700 15px var(--f-body);cursor:pointer;background:var(--surface2);color:var(--ink);min-height:46px;display:inline-flex;align-items:center;justify-content:center;gap:8px;text-align:center}
.btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn.energy{background:var(--energy);color:#1A1300}
.btn.ghost{background:transparent;border:1px solid var(--line)}
.btn.small{min-height:36px;padding:7px 12px;font-size:14px;border-radius:10px}
.btn.block{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.hero .btn{background:var(--bg);color:var(--ink)}
.hero .btn.primary{background:var(--accent);color:var(--accent-ink)}
.btn:focus-visible,.chip:focus-visible,.tab:focus-visible,input:focus-visible,select:focus-visible{outline:3px solid var(--accent);outline-offset:2px}
.chip{appearance:none;border:1px solid var(--line);background:var(--surface);color:var(--ink);border-radius:999px;padding:8px 13px;font:600 14px var(--f-body);cursor:pointer;min-height:38px}
.chip.on{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.chips{display:flex;flex-wrap:wrap;gap:8px}
.pill{display:inline-block;font-size:12px;font-weight:700;border-radius:999px;padding:3px 9px;background:var(--surface2);color:var(--ink)}
.pill.good{background:var(--good-soft);color:var(--good)}
.pill.warn{background:var(--energy-soft);color:var(--energy)}
.pill.bad{background:var(--bad-soft);color:var(--bad)}
.pill.acc{background:var(--accent-soft);color:var(--accent)}
.big{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.1;font-variant-numeric:tabular-nums}
.num{font-variant-numeric:tabular-nums}
.bar{height:10px;border-radius:999px;background:var(--surface2);overflow:hidden}
.bar>i{display:block;height:100%;background:var(--accent);border-radius:999px;transition:width .3s}
.list{display:flex;flex-direction:column}
.li{display:flex;align-items:center;gap:12px;padding:11px 0;border-top:1px solid var(--line);min-width:0}
.li:first-child{border-top:0}
.li .t{font-variant-numeric:tabular-nums;font-weight:700;width:48px;flex:none}
.li .grow{min-width:0}
.check{width:26px;height:26px;border-radius:8px;border:2px solid var(--line);background:transparent;flex:none;cursor:pointer;display:grid;place-items:center;color:var(--accent-ink);padding:0}
.check.on{background:var(--good);border-color:var(--good)}
.check svg{width:16px;height:16px}
.li.past .grow{opacity:.55}
.li.done .grow b{text-decoration:line-through}
label.f{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:600;color:var(--muted);min-width:0}
input,select{font:600 16px var(--f-body);color:var(--ink);background:var(--bg);border:1px solid var(--line);border-radius:10px;padding:10px 11px;min-height:44px;width:100%}
.grid2{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}
.grid3{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px}
@media (max-width:360px){.grid3{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-display);font-size:19px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--muted);font-weight:600}
.exrow{display:flex;gap:12px;align-items:center;padding:10px 0;border-top:1px solid var(--line);cursor:pointer;background:none;border-left:0;border-right:0;border-bottom:0;width:100%;text-align:left;color:var(--ink);font:inherit}
.exrow:first-child{border-top:0}
.exrow .blk{font-size:11px;font-weight:800;letter-spacing:.06em;text-transform:uppercase;color:var(--muted);width:70px;flex:none}
.exrow .dose{font-variant-numeric:tabular-nums;font-weight:700;white-space:nowrap}
.note{border-left:3px solid var(--energy);padding:8px 12px;background:var(--energy-soft);border-radius:0 10px 10px 0;font-size:14px}
.note.blue{border-color:var(--accent);background:var(--accent-soft)}
.note.red{border-color:var(--bad);background:var(--bad-soft)}
details>summary{cursor:pointer;font-weight:700;list-style:none}
details>summary::-webkit-details-marker{display:none}
details>summary::after{content:" ＋";color:var(--muted)}
details[open]>summary::after{content:" －"}
.spark{width:100%;height:70px;display:block}
table.mt{width:100%;border-collapse:collapse;font-size:14px}
table.mt td,table.mt th{padding:7px 4px;border-top:1px solid var(--line);text-align:right;font-variant-numeric:tabular-nums}
table.mt th{font-size:12px;color:var(--muted);font-weight:700}
table.mt td:first-child,table.mt th:first-child{text-align:left}
.tbl{overflow-x:auto}

/* bottom tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:20;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom, 0px);padding-left:max(8px, env(safe-area-inset-left, 0px));padding-right:max(8px, env(safe-area-inset-right, 0px))}
.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr)}
.tab{appearance:none;background:none;border:0;color:var(--muted);font:700 11px var(--f-body);padding:9px 2px 10px;display:flex;flex-direction:column;align-items:center;gap:3px;cursor:pointer}
.tab svg{width:24px;height:24px}
.tab.on{color:var(--accent)}

/* player */
#player,#wizard{position:fixed;inset:0;z-index:50;background:var(--bg);overflow-y:auto;padding-top:env(safe-area-inset-top, 0px);padding-bottom:env(safe-area-inset-bottom, 0px)}
.pl{max-width:560px;margin:0 auto;min-height:100%;display:flex;flex-direction:column;gap:12px;padding-block:12px 20px;padding-left:max(16px, env(safe-area-inset-left, 0px));padding-right:max(16px, env(safe-area-inset-right, 0px))}
.pl-top{display:flex;align-items:center;gap:10px}
.pl-prog{flex:1}
.pl-block{font-size:12px;font-weight:800;letter-spacing:.09em;text-transform:uppercase;color:var(--accent)}
.pl-name{font-family:var(--f-display);font-weight:700;font-size:22px;line-height:1.15;text-wrap:balance}
.fig{width:100%;max-width:300px;aspect-ratio:6/5;display:block;margin:0 auto;background:var(--surface);border:1px solid var(--line);border-radius:18px}
.timer{font-family:var(--f-display);font-weight:700;font-size:min(26vw,104px);line-height:1;text-align:center;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.timer.rest{color:var(--accent)}
.timer.run{color:var(--energy)}
.target{text-align:center}
.target .big{font-size:44px}
.wz-dots{display:flex;gap:6px}
.wz-hello{font-family:var(--f-display);font-weight:700;font-size:26px;line-height:1.15;text-wrap:balance}
.dots{display:flex;gap:6px;justify-content:center}
.dots i{width:28px;height:6px;border-radius:9px;background:var(--surface2)}
.dots i.on{background:var(--good)}
.dots i.cur{background:var(--energy)}
.pl-actions{display:flex;flex-direction:column;gap:10px;margin-top:auto}
.pl-actions .row .btn{flex:1}
.iconbtn{appearance:none;width:42px;height:42px;border-radius:12px;border:1px solid var(--line);background:var(--surface);color:var(--ink);display:grid;place-items:center;cursor:pointer;flex:none}
.iconbtn svg{width:20px;height:20px}

/* sheet + toast */
#sheet{position:fixed;inset:0;z-index:60;background:color-mix(in srgb, #000 45%, transparent);display:flex;align-items:flex-end;justify-content:center}
.sheet-card{background:var(--surface);width:100%;max-width:560px;max-height:88vh;overflow-y:auto;border-radius:20px 20px 0 0;padding:18px max(16px, env(safe-area-inset-right, 0px)) calc(18px + env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));display:flex;flex-direction:column;gap:12px}
#toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom, 0px));z-index:70;background:var(--ink);color:var(--bg);padding:12px 16px;border-radius:14px;font-weight:700;max-width:min(92vw,520px);display:flex;gap:12px;align-items:center;box-shadow:0 8px 30px rgba(0,0,0,.25)}
#toast button{background:var(--bg);color:var(--ink);border:0;border-radius:9px;padding:7px 11px;font:700 14px var(--f-body);cursor:pointer}
ol.how{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:6px}
@media (prefers-reduced-motion: reduce){ .bar>i{transition:none} }
</style>

<div class="wrap">
  <header class="top">
    <div class="brand"><small>Домашний тренер без отмазок</small>Discipline <span style="color:var(--energy)">Gym</span></div>
    <div class="date" id="today-date"></div>
  </header>
  <main id="view" aria-live="polite"></main>
</div>

<nav class="tabs" aria-label="Разделы">
  <div class="in">
    <button class="tab" data-tab="today" id="tab-today"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M2 12h2M20 12h2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>Сегодня</button>
    <button class="tab" data-tab="plan" id="tab-plan"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M3 12h2M19 12h2M5 8v8M19 8v8M7 6v12M17 6v12M7 12h10"/></svg>Тренировки</button>
    <button class="tab" data-tab="life" id="tab-life"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 14.5A8 8 0 0 1 9.5 4a8 8 0 1 0 10.5 10.5z"/></svg>Режим</button>
    <button class="tab" data-tab="me" id="tab-me"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="8" r="4"/><path d="M4 21c1.5-4 4.5-6 8-6s6.5 2 8 6"/></svg>Профиль</button>
  </div>
</nav>

<section id="player" hidden></section>
<section id="wizard" hidden aria-label="Настройка"></section>
<div id="sheet" hidden><div class="sheet-card" id="sheet-body" role="dialog" aria-modal="true"></div></div>
<div id="toast" hidden></div>

<script id="logic">
(function(G){
"use strict";
// ---------- exercises ----------
// k: reps | time; r: base reps; t: base seconds; s: sides (2 = each side)
const EX = {
 w_march:{n:"Шаги на месте с высоким коленом",k:"time",t:60,eq:"без инвентаря",m:"разогрев всего тела",pose:"march",how:["Шагай на месте, колени поднимай повыше.","Руки работают как при ходьбе.","Дыши ровно, темп спокойный."]},
 w_arms:{n:"Круги руками",k:"time",t:30,eq:"без инвентаря",m:"плечи",pose:"armcirc",sh:1,how:["Руки в стороны, делай маленькие круги.","Половину времени вперёд, половину назад.","Если плечо тянет, делай круги ещё меньше."]},
 w_hips:{n:"Круги тазом",k:"time",t:30,eq:"без инвентаря",m:"поясница, таз",pose:"hips",how:["Руки на поясе, ноги на ширине плеч.","Медленно рисуй тазом круг.","Половину времени в одну сторону, половину в другую."]},
 w_cat:{n:"Кошка-корова",k:"time",t:40,eq:"коврик",m:"спина",pose:"cat",how:["Встань на четвереньки: ладони под плечами, колени под тазом.","На вдохе прогни спину и подними голову.","На выдохе выгни спину вверх, голову опусти. Медленно."]},
 w_er:{n:"Наружная ротация плеча",k:"reps",r:12,s:2,eq:"лёгкая гантель или резинка",m:"мышцы-вращатели плеча",pose:"er",how:["Ляг на бок. Верхняя рука согнута под прямым углом, локоть прижат к боку.","Гантель у живота. Медленно поднимай предплечье вверх, локоть не отрывай.","Так же медленно опусти. Без боли."],tip:"Это разминка для твоего плеча, похожая на ту, что ты уже делаешь. Только медленно."},
 w_squat:{n:"Присед без веса",k:"reps",r:10,eq:"без инвентаря",m:"ноги",pose:"squatbw",how:["Ноги на ширине плеч, носки чуть в стороны.","Таз назад и вниз, как будто садишься на стул.","Пятки не отрываются, колени смотрят туда же, куда носки."]},

 pullup_band:{n:"Подтягивания с резинкой",k:"reps",r:6,main:1,sh:1,eq:"турник, резинка",m:"спина, бицепс",pose:"pullband",how:["Закрепи резинку на турнике, поставь в петлю колено или стопу.","Возьмись хватом чуть шире плеч, повисни на прямых руках.","Тянись грудью к турнику, пока подбородок не окажется выше перекладины.","Опускайся медленно, до прямых рук."],tip:"Плечи не поднимай к ушам."},
 pullup_neg:{n:"Негативные подтягивания",k:"reps",r:4,main:1,sh:1,eq:"турник, стул",m:"спина, бицепс",pose:"pullneg",how:["Встань на стул и займи верхнюю точку: подбородок над перекладиной.","Опускайся как можно медленнее, 3–5 секунд, до прямых рук.","Снова встань на стул и повтори."],tip:"Лучший способ научиться подтягиваться, когда пока выходит 1–2 раза."},
 row:{n:"Тяга гантели в наклоне",k:"reps",r:10,s:2,main:1,eq:"гантель, диван",m:"спина",pose:"row",how:["Одно колено и одна рука на диване, спина ровная, почти параллельно полу.","Гантель в свободной руке, рука прямая.","Тяни гантель к поясу, локоть веди вдоль тела назад.","Медленно опусти. Сделай все повторы, потом другая рука."]},
 pushup:{n:"Отжимания",k:"reps",r:8,hi:1,main:1,sh:1,alt:"pushup_inc",eq:"без инвентаря",m:"грудь, трицепс, плечи",pose:"push",how:["Ладони чуть шире плеч, тело прямое от головы до пяток.","Опускайся, пока грудь почти не коснётся пола. Локти не в стороны, а примерно под 45° к телу.","Выжмись вверх."],tip:"Если плечо ноет, делай от дивана: так плечу легче."},
 pushup_inc:{n:"Отжимания от дивана",k:"reps",r:12,hi:1,main:1,eq:"диван или крепкий стул",m:"грудь, трицепс",pose:"pushinc",how:["Ладони на край дивана, тело прямое.","Опускай грудь к краю, локти под углом к телу.","Выжмись вверх."],tip:"Щадящий вариант для плеча. Чем ниже опора, тем тяжелее."},
 floor_press:{n:"Жим гантели лёжа на полу",k:"reps",r:10,s:2,main:1,eq:"гантель",m:"грудь, трицепс",pose:"floor",how:["Ляг на спину, колени согнуты, гантель в одной руке над грудью.","Опускай, пока локоть мягко не коснётся пола.","Выжми вверх. Все повторы, потом другая рука."],tip:"Пол не даёт опустить руку слишком низко, поэтому для плеча это безопаснее."},
 lat_raise:{n:"Подъём рук в стороны",k:"reps",r:12,sh:1,eq:"лёгкая гантель",m:"плечи (дельты)",pose:"latraise",how:["Стоя, гантели в опущенных руках, локти чуть согнуты. Если гантель одна — делай по очереди каждой рукой, свободной держись за стену.","Поднимай руки в стороны до уровня плеч, не выше.","Медленно опусти."],tip:"Для плеча: не выше уровня плеч и без рывков."},

function emptyEq(){return {bar:false,dips:false,band_light:false,band_med:false,band_heavy:false,chair:true,mat:false,db:[]};}
function normEq(e){
 const o=Object.assign(emptyEq(),e||{});
 Object.keys(EQ_LABEL).forEach(function(k){o[k]=!!o[k];});
 o.db=(Array.isArray(o.db)?o.db:[]).map(Number).filter(function(v){return v>0&&v<=200;}).sort(function(a,b){return b-a;});
 return o;

function dbPick(list,load){
 const w=(list||[]).slice().sort(function(a,b){return a-b;});if(!w.length)return null;
 const max=w[w.length-1],min=w[0];

// Training days in [from, to) with no workout. A workout on a rest day later on counts as making it up.
function missedBetween(st,from,to,until){

 if(p.planFrom){const pf=parseKey(p.planFrom);if(pf>start)start=pf;}

 const byDay={};(st.history||[]).forEach(function(h){if(h.tpl!=="STR")byDay[h.d]=(byDay[h.d]||0)+1;});

  if(days.indexOf(d.getDay())>=0&&!byDay[dkey(d)]){for(let e=dayAdd(d,1);e<from;e=dayAdd(e,1)){const ek=dkey(e);if(days.indexOf(e.getDay())<0&&byDay[ek]&&!used[ek]){used[ek]=1;break;}}}

  const k=dkey(d);

  let comp=false;

function weekReport(st,mon,today){
 today=midnight(today||new Date());
 const end=dayAdd(mon,7);const last=end>dayAdd(today,1)?dayAdd(today,1):end; // days that already happened (incl. today)
 const p=st.profile,days=trainDays(p),start=parseKey(p.start||dkey());
 const inWeek=function(k){const d=parseKey(k);return d>=mon&&d<end;};
 const hist=(st.history||[]).filter(function(h){return inWeek(h.d);});
 const strength=hist.filter(function(h){return h.tpl!=="STR";}),stretch=hist.filter(function(h){return h.tpl==="STR";});
 let planned=0;for(let d=mon;d<last;d=dayAdd(d,1)){if(d>=start&&days.indexOf(d.getDay())>=0)planned++;}
 // today's session can still happen, so do not count today as missed
 const missed=missedBetween(st,mon,last>today?today:last,today);
 const nights=Object.keys(st.sleep||{}).filter(inWeek).map(function(k){return sleepDur(st.sleep[k]);}).filter(function(v){return v!=null;});
 const sleepAvg=nights.length?Math.round(nights.reduce(function(a,b){return a+b;},0)/nights.length):null;
 const wDays=Object.keys(st.water||{}).filter(inWeek);
 let waterSum=0,waterOk=0;wDays.forEach(function(k){const ml=st.water[k]||0;waterSum+=ml;const tr=days.indexOf(parseKey(k).getDay())>=0;if(ml>=waterTarget(p,tr))waterOk++;});
 const nDays=Math.max(1,Math.round((last-mon)/864e5));
 const meals=Object.keys(st.meals||{}).filter(inWeek).reduce(function(a,k){return a+Object.values(st.meals[k]).filter(Boolean).length;},0);
 const creatine=Object.keys(st.suppLog||{}).filter(inWeek).filter(function(k){return st.suppLog[k].creatine;}).length;
 const feel={easy:0,ok:0,hard:0};strength.forEach(function(h){if(feel[h.feel]!=null)feel[h.feel]++;});
 const before=(st.meas||[]).filter(function(m){return parseKey(m.d)<mon;}),within=(st.meas||[]).filter(function(m){return inWeek(m.d);});
 let wFrom=null,wTo=null;
 if(within.length){wTo=parseFloat(within[within.length-1].weight);wFrom=before.length?parseFloat(before[before.length-1].weight):(within.length>1?parseFloat(within[0].weight):null);}
 const fDays=Object.keys(st.food||{}).filter(inWeek).filter(function(k){return (st.food[k]||[]).length;});
 let foodK=null,foodP=null;
 if(fDays.length){let sk=0,sp=0;fDays.forEach(function(k){const t=foodTotals(st.food[k]);sk+=t.k;sp+=t.p;});foodK=Math.round(sk/fDays.length);foodP=Math.round(sp/fDays.length);}
 const tips=[];
 if(planned&&strength.length>=planned)tips.push("Все тренировки по плану сделаны. Так держать!");
 else if(missed.length){
  const lazy=missed.filter(function(m){return m.reason==="lazy";}).length;
  if(lazy>=2)tips.push("Два пропуска из-за лени. Попробуй тренироваться в одно и то же время и сразу начинать с разминки: самое сложное — начать.");
  else tips.push("Были пропуски. Главное правило: не пропускать два раза подряд.");
 }
 if(sleepAvg!=null&&sleepAvg<420)tips.push("Сон в среднем меньше 7 часов. Мышцы растут во сне, поэтому сон сейчас важнее лишнего подхода.");
 if(wDays.length&&waterOk<Math.ceil(wDays.length/2))tips.push("Воды мало: норму выпил только "+waterOk+" из "+wDays.length+" отмеченных дней.");
 if(feel.hard>feel.easy+feel.ok&&feel.hard>=2)tips.push("Тренировки часто тяжёлые. Нормально, если 1–2 раза, но если так и дальше — выбери темп «Плавно».");
 if(feel.easy>=2&&feel.easy>feel.hard)tips.push("Часто «легко»: тренер уже добавляет повторы. Если хочется больше — выбери темп быстрее.");
 if(foodP!=null){const nt=nutrition(p);if(foodP<nt.protein*0.8)tips.push("Белка мало: в среднем "+foodP+" г в день при норме "+nt.protein+" г. Добавь творог, яйца, курицу.");}
 return {foodDays:fDays.length,foodK:foodK,foodP:foodP,mon:dkey(mon),end:dkey(dayAdd(mon,6)),planned:planned,done:strength.length,stretch:stretch.length,minutes:hist.reduce(function(a,h){return a+(h.dur||0);},0),
  missed:missed,sleepAvg:sleepAvg,nights:nights.length,waterAvg:wDays.length?Math.round(waterSum/wDays.length):0,waterDays:wDays.length,waterOk:waterOk,nDays:nDays,meals:meals,creatine:creatine,feel:feel,wFrom:wFrom,wTo:wTo,tips:tips};
}

function normTxt(s){return String(s||"").toLowerCase().replace(/ё/g,"е");}
function foodSearch(q,mine){
 const all=(mine||[]).concat(FOOD);
 const words=normTxt(q).split(/[^a-zа-я0-9]+/).filter(Boolean).map(function(w){return w.length>3?w.slice(0,-1):w;});
 if(!words.length)return all;
 return all.filter(function(f){const t=normTxt(f.n+" "+(f.a||""));return words.every(function(w){return t.indexOf(w)>=0;});});
}
function foodCalc(f,g){
 const r=function(v,d){const m=Math.pow(10,d);return Math.round(v*m)/m;};
 return {k:Math.round(f.k*g/100),p:r(f.p*g/100,1),f:r(f.f*g/100,1),c:r(f.c*g/100,1)};
}
function foodTotals(list){
 const t={k:0,p:0,f:0,c:0};(list||[]).forEach(function(x){t.k+=x.k||0;t.p+=x.p||0;t.f+=x.f||0;t.c+=x.c||0;});
 t.k=Math.round(t.k);t.p=Math.round(t.p);t.f=Math.round(t.f);t.c=Math.round(t.c);return t;
}

function applyFeedback(st,id,fb){
 const e=EX[id];if(!e)return;
 if(fb==="easy")st.lvl[id]=(st.lvl[id]||0)+1;
 else if(fb==="hard")st.lvl[id]=(st.lvl[id]||0)-1;
 else if(fb==="pain"){st.lvl[id]=(st.lvl[id]||0)-1;if(e.alt)st.alt[id]=true;}
 st.lvl[id]=clamp(st.lvl[id]||0,-6,20);
}

function avgWake(st){
 const ks=Object.keys(st.sleep).sort().slice(-7);const ms=ks.map(function(k){return toMin(st.sleep[k].wake);}).filter(function(v){return v!=null;});
 if(!ms.length)return 480;return Math.round(ms.reduce(function(a,b){return a+b;},0)/ms.length/5)*5;
}

// Day plan: events as offsets from wake-up (minutes), so a late wake shifts everything.
function dayPlan(st,date){
 date=date||new Date();const k=dkey(date);
 const p=st.profile;const firstDay=k===dkey()&&!(st.history||[]).some(function(h){return h.tpl!=="STR";});
 const training=firstDay||trainDays(p).indexOf(date.getDay())>=0;
 const night=st.sleep[k];const wake=(night&&toMin(night.wake)!=null)?toMin(night.wake):avgWake(st);
 const awake=960;const ev=[];
 const add=function(off,key,label,kind,extra){ev.push(Object.assign({off:off,t:(wake+off)%1440,key:key,label:label,kind:kind},extra||{}));};
 add(45,"breakfast","Завтрак","meal");
 add(300,"lunch","Обед","meal");
 let wOff=null;
 if(training){
  wOff=Math.min(420,awake-180);
  add(wOff,"workout","Тренировка","workout");
  if(wOff-90-300>=90)add(wOff-90,"snack","Перекус перед тренировкой","meal");
  const post=wOff+75;const dinner=awake-180;
  if(dinner-post>=90)add(post,"post","Поесть после тренировки (белок + углеводы)","meal");
 } else add(480,"snack","Перекус","meal");
 add(awake-180,"dinner","Ужин (последняя еда)","meal");
 const all=(st.supps||[]).filter(function(s){return s.on;}).map(function(s){return Object.assign({id:s.id},SUPP_LIB[s.id]||(st.custom||[]).find(function(c){return c.id===s.id;})||{n:s.id,when:"any"});});
 all.forEach(function(s){
  let off;const w=s.when;
  if(w==="pre"){if(!training)return;off=wOff-45;}
  else if(w==="post")off=training?wOff+60:300;
  else if(w==="evening")off=awake-150;
  else off=45;
  add(off,"supp_"+s.id,s.n+(s.dose?" · "+s.dose:""),"supp",{sid:s.id});
 });
 const glass=Math.round(waterTarget(p,training)/7/50)*50;
 for(let i=0;i<7;i++)add(15+i*130,"water"+i,"Вода · "+glass+" мл","water");
 add(awake-30,"winddown","Убрать телефон, готовиться ко сну","sleep");
 add(awake,"bed","Лечь спать, чтобы поспать 8 часов","sleep");
 ev.sort(function(a,b){return a.off-b.off||(a.kind==="supp")-(b.kind==="supp");});
 return {training:training,wake:wake,events:ev,bedTarget:(avgWake(st)+awake)%1440};
}

function prune(st){
 const lim=dkey(new Date(Date.now()-120*864e5));
 ["sleep","water","meals","suppLog","missed","food"].forEach(function(f){Object.keys(st[f]||{}).forEach(function(k){if(k<lim)delete st[f][k];});});
 if(st.history.length>300)st.history=st.history.slice(-300);
 if(st.meas.length>200)st.meas=st.meas.slice(-200);
}

// Android app: hand the next 7 days of reminders to the phone, so they fire even when the app is closed.
function syncReminders(){
 if(!NATIVE)return;
 try{
  const N=st.settings.notif||{};const out=[];const now=Date.now();const today=new Date();
  for(let i=0;i<7;i++){
   const d=new Date(today.getFullYear(),today.getMonth(),today.getDate()+i);const k=K.dkey(d);
   const plan=K.dayPlan(st,d);const base=d.getTime();
   const at=function(off){return base+(plan.wake+off)*60000;};
   plan.events.forEach(function(e){
    let title="",text="";
    if(e.kind==="workout"){if(!N.workout)return;if(i===0&&doneToday().length)return;
     out.push({at:at(e.off-30),title:"Через 30 минут тренировка",text:"Попей воды и приготовь инвентарь."});
     title="Пора тренироваться";text=i===0?"Сегодня: "+TPL[K.nextTpl(st)].n:"Открой Discipline Gym и начни тренировку.";}
    else if(e.kind==="water"){if(!N.water)return;title="Попей воды";text=e.label;}
    else if(e.kind==="meal"){if(!N.meals)return;if(i===0&&(st.meals[k]||{})[e.key])return;title=e.label;text="Время поесть по режиму.";}
    else if(e.kind==="supp"){if(!N.meals)return;if(i===0&&(st.suppLog[k]||{})[e.sid])return;title="Добавки";text=e.label;}
    else if(e.kind==="sleep"){if(!N.sleep)return;title=e.key==="bed"?"Пора спать":"Скоро спать";text=e.label;}
    else return;
    out.push({at:at(e.off),title:title,text:text});
   });
  }
  const list=out.filter(function(x){return x.at>now+30000;}).sort(function(a,b){return a.at-b.at;}).slice(0,60);
  window.Android.schedule(JSON.stringify(list));
 }catch(e){}
}

  const ref=db.collection("data/users/"+uid).doc("state");
  const snap=await ref.get();

   const data=snap.data();
   if(data&&(data.updatedAt||0)>(st.updatedAt||0)){
    st=merge(K.defaultState(),JSON.parse(JSON.stringify(data)));
    try{localStorage.setItem(LS,JSON.stringify(st));}catch(e){}

 else if(step==="goal"){body='<h2>Чего хочешь?</h2><p class="small muted">Можно выбрать несколько. Из первых трёх — одну.</p><p class="section-label" style="margin-top:0">Тело</p><div class="chips">'+Object.keys(K.BODY).map(function(g){return '<button class="chip'+(p.body===g?" on":"")+'" data-act="body" data-v="'+g+'">'+K.BODY[g]+'</button>';}).join("")+'</div><p class="section-label">Плюс к этому</p><div class="chips">'+Object.keys(K.EXTRAS).map(function(g){return '<button class="chip'+(p[g]?" on":"")+'" data-act="extra" data-v="'+g+'">'+K.EXTRAS[g]+'</button>';}).join("")+'</div><p><b>Выбрано: '+esc(K.goalLabel(p))+'</b></p>';}

 else if(step==="areas"){body='<h2>Что-нибудь болит?</h2><p class="small muted">Тренер уберёт или заменит упражнения, которые нагружают эти места.</p><div class="chips">'+Object.keys(K.AREAS).map(function(a){return '<button class="chip'+(hasArea(a)?" on":"")+'" data-act="area" data-v="'+a+'">'+K.AREAS[a]+'</button>';}).join("")+'</div>'+areaLvlHtml()+condHtml()+'<label class="f">Своя заметка (необязательно)<input id="pf-areaNote" data-pf="areaNote" maxlength="80" value="'+esc(p.areaNote||"")+'"></label>';btns='<button class="btn primary block" data-act="wz-next">Дальше</button>'+(p.areas.length?'':'<p class="small muted target">Если ничего не болит, просто жми «Дальше».</p>');}

 p.areas.forEach(function(a){const hi=(p.areaLvl||{})[a]==="high";h+='<div class="row between"><span>'+K.AREAS[a]+'</span><div class="chips"><button class="chip'+(!hi?" on":"")+'" data-act="area-lvl" data-v="'+a+'" data-l="low">Немного</button><button class="chip'+(hi?" on":"")+'" data-act="area-lvl" data-v="'+a+'" data-l="high">Сильно</button></div></div>';});
 return h+'<p class="small muted" style="margin:0">«Сильно» — тренер уберёт всё, что нагружает это место.</p></div>';
}

function notifCard(){

function advice(){
 const p=st.profile;const hM=(+p.height)/100;const bmi=(+p.weight)/(hM*hM);const waist=parseFloat(st.cur.waist);
 let h='<p>Индекс массы тела: <b class="num">'+(isFinite(bmi)?bmi.toFixed(1).replace(".",","):"—")+'</b>. '+(bmi<18.5?"Это мало: лучше цель «Набрать мышцы».":bmi<25?"Это норма.":bmi<30?"Чуть выше нормы. Но у накачанных людей он тоже высокий, поэтому важнее талия.":"Это много: лучше цель «Сбросить жир».")+'</p>';
 if(waist){const r=waist/(+p.height);h+='<p>Талия к росту: <b class="num">'+r.toFixed(2).replace(".",",")+'</b>. '+(r<0.5?"Отлично, жира немного. Можно спокойно набирать мышцы.":r<0.55?"Немного лишнего жира на животе. Лучше всего «Сила и рельеф».":"Жира на животе многовато. Тренер советует «Сбросить жир», а потом набирать.")+'</p>';}
 else h+='<p class="small muted">Впиши талию в замерах ниже — по ней тренер точнее подскажет цель.</p>';
 return h;
}
function measHistory(){
 if(!st.meas.length)return '';
 const first=st.meas[0],last=st.meas[st.meas.length-1];
 let h='<p class="section-label" style="margin-top:4px">Изменения</p><div class="tbl"><table class="mt"><tr><th></th><th>Было</th><th>Сейчас</th><th>Разница</th></tr>';
 [["weight","Вес, кг"]].concat(MEAS).forEach(function(m){
  const a=parseFloat(first[m[0]]),b=parseFloat(last[m[0]]);if(isNaN(a)&&isNaN(b))return;
  const d=(!isNaN(a)&&!isNaN(b))?(b-a):null;
  h+='<tr><td>'+m[1]+'</td><td>'+(isNaN(a)?"—":a)+'</td><td>'+(isNaN(b)?"—":b)+'</td><td>'+(d==null?"—":(d>0?"+":"")+(Math.round(d*10)/10))+'</td></tr>';
 });
 h+='</table></div><p class="small muted">Первый замер: '+esc(K.parseKey(first.d).toLocaleDateString("ru-RU"))+', последний: '+esc(K.parseKey(last.d).toLocaleDateString("ru-RU"))+'.</p>';
 const ws=st.meas.filter(function(m){return !isNaN(parseFloat(m.weight));});
 if(ws.length>=2){
  const vs=ws.map(function(m){return parseFloat(m.weight);});const mn=Math.min.apply(null,vs),mx=Math.max.apply(null,vs);const rg=Math.max(1,mx-mn);
  const pts=vs.map(function(v,i){return [8+i*(284/(vs.length-1)),60-((v-mn)/rg)*48];});
  h+='<svg class="spark" viewBox="0 0 300 70" role="img" aria-label="График веса"><text x="8" y="10" font-size="10" fill="var(--muted)">'+mx+' кг</text><text x="8" y="69" font-size="10" fill="var(--muted)">'+mn+' кг</text><polyline points="'+pts.map(function(p){return p[0].toFixed(1)+","+p[1].toFixed(1);}).join(" ")+'" fill="none" stroke="var(--accent)" stroke-width="2.5" stroke-linejoin="round"/>'+'<circle cx="'+pts[pts.length-1][0].toFixed(1)+'" cy="'+pts[pts.length-1][1].toFixed(1)+'" r="4" fill="var(--accent)"/></svg>';
 }
 return h;
}
function lvlHtml(){
 const ids=Object.keys(st.lvl).filter(function(k){return st.lvl[k]!==0&&EX[k];});
 const alts=Object.keys(st.alt).filter(function(k){return st.alt[k]&&EX[k];});
 if(!ids.length&&!alts.length)return '<p class="small muted">После каждого упражнения отвечай «легко / нормально / тяжело». Тренер сам добавит или уберёт повторы.</p>';
 let h='<div class="list">';
 ids.forEach(function(k){const v=st.lvl[k];h+='<div class="li"><div class="grow">'+esc(EX[k].n)+'</div><span class="pill '+(v>0?"good":"warn")+'">'+(v>0?"+":"")+v+'</span></div>';});
 alts.forEach(function(k){h+='<div class="li"><div class="grow">'+esc(EX[k].n)+' → '+esc(EX[EX[k].alt].n)+'</div><button class="btn small ghost" data-act="alt-reset" data-k="'+k+'">Вернуть</button></div>';});
 return h+'</div>';
}

// ---------- actions ----------
document.addEventListener("click",function(ev){
 const b=ev.target.closest("[data-act]");if(!b)return;
 const a=b.dataset.act;
 if(a!=="sheet-close")ensureAudio();
 const k=today();
 switch(a){
  case "go":setTab(b.dataset.tab);break;
  case "profile-ok":st.profile.checked=true;save();render();break;
  case "wz-open":openWizard();break;
  case "wz-back":wzRead();save();wz.step=Math.max(0,wz.step-1);drawWizard();break;
  case "wz-next":{const any=wzRead();const ck=b.dataset.check;
   if(ck==="body"){const p=st.profile;if(!(+p.age>0&&+p.height>0&&+p.weight>0)){toast("Впиши возраст, рост и вес. Или нажми «Заполню позже».");break;}}
   if(ck==="meas"&&any){const rec={d:k,weight:st.profile.weight};MEAS.forEach(function(m){rec[m[0]]=st.cur[m[0]];});st.meas=st.meas.filter(function(x){return x.d!==k;});st.meas.push(rec);}
   save();wz.step=Math.min(WZ.length-1,wz.step+1);drawWizard();$("#wizard").scrollTop=0;break;}
  case "wz-finish":wzRead();closeWizard();break;
  case "eq-toggle":{const e=K.normEq(st.profile.eq);e[b.dataset.v]=!e[b.dataset.v];st.profile.eq=e;save();render();break;}
  case "eq-none":{const e=K.emptyEq();e.chair=K.normEq(st.profile.eq).chair;st.profile.eq=e;save();render();toast("Тренер подберёт упражнения без инвентаря");break;}
  case "db-add":{const inp=$("#db-new");const v=parseFloat(String(inp&&inp.value||"").replace(",","."));if(!(v>0&&v<=80)){toast("Впиши вес гантели в кг, например 8.");break;}const e=K.normEq(st.profile.eq);e.db.push(Math.round(v*2)/2);if(wz)wzRead();st.profile.eq=K.normEq(e);save();render();break;}
  case "db-del":{const e=K.normEq(st.profile.eq);e.db.splice(+b.dataset.i,1);st.profile.eq=e;save();render();break;}
  case "hist-del":{const i=+b.dataset.i;const x=st.history[i];if(!x)break;if(!b.dataset.sure){b.dataset.sure="1";b.textContent="Точно?";break;}
   const lastStr=st.history.map(function(h,j){return h.tpl!=="STR"?j:-1;}).filter(function(j){return j>=0;}).pop();
   st.history.splice(i,1);
   if(x.tpl!=="STR"&&i===lastStr&&st.seq>0){const sq=K.planSeq(st.profile);if(sq[((st.seq-1)%sq.length+sq.length)%sq.length]===x.tpl)st.seq--;}

// ---------- workout player ----------
let P=null,tick=null,wake=null;
function startWorkout(tpl){
 closeSheet();ensureAudio();
 const w=K.buildWorkout(tpl,st,wOpts(tpl));
 if(!w.steps.length)return;
 P={w:w,si:0,set:1,side:0,phase:"ready",endAt:0,lastSec:null,started:Date.now(),sets:0,feel:{},exit:false};
 $("#player").hidden=false;document.body.style.overflow="hidden";
 lockScreen();
 clearInterval(tick);tick=setInterval(onTick,200);
 drawPlayer();
}
async function lockScreen(){if(NATIVE){try{window.Android.keepAwake(true);}catch(e){}return;}try{if(navigator.wakeLock&&document.visibilityState==="visible")wake=await navigator.wakeLock.request("screen");}catch(e){wake=null;}}
document.addEventListener("visibilitychange",function(){if(P&&document.visibilityState==="visible")lockScreen();});
function cur(){return P.w.steps[P.si];}
function blockName(k){return K.BLOCKS.find(function(b){return b[0]===k;})[1];}
function startTimer(phase,sec){P.phase=phase;P.total=sec;P.endAt=Date.now()+sec*1000;P.lastSec=null;drawPlayer();}
function startRun(){say("Начали");startTimer("run",cur().val);}
function startRest(after,sec){P.after=after;say("Отдых "+sec+" секунд");startTimer("rest",sec);}
function signalThen(msg,what){
 alarm();
 if(msg)setTimeout(function(){say(msg);},alarmLen()*1000+150);
 if(st.settings.ring){P.phase="ring";P.ringWhat=what;P.ringAt=Date.now();P.rings=0;drawPlayer();return;}
 if(what==="set")setDone();else afterRest();
}
function afterRest(){if(P.after==="nextEx")goEx(P.si+1);else{P.set++;P.side=0;P.phase="ready";drawPlayer();}}
function remain(){return Math.max(0,Math.ceil((P.endAt-Date.now())/1000));}
function onTick(){
 if(!P)return;
 if(P.phase==="ring"){
  if(Date.now()-P.ringAt>alarmLen()*1000+1200){P.ringAt=Date.now();P.rings++;if(P.rings<25)alarm();}
  return;
 }
 if(["count","run","switch","rest"].indexOf(P.phase)<0)return;
 const r=remain();
 if(r!==P.lastSec){
  P.lastSec=r;
  const el=$("#pl-time");if(el)el.textContent=fmtClock(r);
  if(P.phase==="run"||P.phase==="rest"){
   const tot=P.total||0;
   if(r===60&&tot>=90)say("Осталась минута");
   else if(r===30&&tot>=45)say("Осталось тридцать секунд");
   else if(r===10&&tot>=20)say(P.phase==="rest"?"Приготовься":"Осталось десять секунд");
  }
  if(r>0&&r<=3&&P.phase!=="switch")beepTick();
 }
 if(Date.now()>=P.endAt)phaseDone();
}
function fmtClock(s){if(s>=60)return Math.floor(s/60)+":"+String(s%60).padStart(2,"0");return String(s);}
function phaseDone(){
 const s=cur();
 if(P.phase==="count"){startRun();return;}
 if(P.phase==="run"){
  if(s.sides>1&&P.side===0){P.side=1;alarm();setTimeout(function(){say("Смена стороны");},alarmLen()*1000+150);startTimer("switch",5);return;}
  const last=P.set>=s.sets;
  signalThen(last?"Стоп. Упражнение готово":"Стоп","set");return;
 }
 if(P.phase==="switch"){startRun();return;}
 if(P.phase==="rest"){
  const msg=P.after==="nextEx"?"Следующее: "+EX[P.w.steps[P.si+1].id].n:"Подход "+(P.set+1);
  signalThen(msg,"rest");
 }
}
function setDone(){
 const s=cur();P.sets++;P.side=0;
 if(P.set<s.sets){if(s.rest>0){startRest("nextSet",s.rest);}else{P.set++;P.phase="ready";drawPlayer();}return;}
 if(s.block==="main"||s.block==="extra"||s.block==="core"){P.phase="feedback";drawPlayer();return;}
 afterEx();
}
function afterEx(){
 const s=cur();
 if(P.si+1>=P.w.steps.length){finish();return;}
 if(s.rest>0){startRest("nextEx",s.rest);}else goEx(P.si+1);
}
function goEx(i){
 if(i>=P.w.steps.length){finish();return;}
 P.si=Math.max(0,i);P.set=1;P.side=0;P.phase="ready";P.exit=false;drawPlayer();
}
function finish(){
 P.phase="done";clearInterval(tick);say("Тренировка закончена. Молодец!");
 const dur=Math.max(1,Math.round((Date.now()-P.started)/60000));
 const vals=Object.values(P.feel);const cnt={easy:0,ok:0,hard:0};vals.forEach(function(v){if(v==="pain")cnt.hard++;else if(cnt[v]!=null)cnt[v]++;});
 const feel=vals.length?(cnt.hard>cnt.easy&&cnt.hard>=cnt.ok?"hard":cnt.easy>cnt.ok?"easy":"ok"):"ok";
 st.history.push({d:today(),tpl:P.w.tpl,name:P.w.name,dur:dur,sets:P.sets,feel:feel});
 if(P.w.tpl!=="STR"&&P.w.steps.some(function(x){return x.block==="main";}))st.mod=null;
 if(P.w.tpl!=="STR"&&P.w.tpl===K.nextTpl(st))st.seq++;
 save();P.dur=dur;drawPlayer();
}
function closePlayer(){P=null;clearInterval(tick);$("#player").hidden=true;$("#player").innerHTML="";document.body.style.overflow="";try{wake&&wake.release();}catch(e){}if(NATIVE){try{window.Android.keepAwake(false);}catch(e){}}wake=null;render();}

function dots(s){let h='<div class="dots" aria-label="Подходы">';for(let i=1;i<=s.sets;i++)h+='<i class="'+(i<P.set?"on":i===P.set?"cur":"")+'"></i>';return h+'</div>';}
const ICON_BACK='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"/></svg>';
const ICON_X='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6L6 18"/></svg>';
function drawPlayer(){
 const root=$("#player");if(!P){return;}
 if(P.phase==="done"){
  root.innerHTML='<div class="pl"><div style="height:30px"></div><span class="pl-block">Тренировка завершена</span><div class="pl-name">'+esc(P.w.name)+'</div><div class="grid2"><div class="card stat"><b>'+P.dur+' мин</b><span>время</span></div><div class="card stat"><b>'+P.sets+'</b><span>подходов</span></div></div><p>Отлично! Теперь вода и еда с белком в ближайшие 1–2 часа. Тренер запомнил твои ответы и подстроит следующую тренировку.</p><div class="pl-actions"><button class="btn primary block" data-pl="close">Готово</button></div></div>';
  return;
 }
 const s=cur(),e=EX[s.id];const total=P.w.steps.length;const pct=Math.round(P.si/total*100);
 let h='<div class="pl"><div class="pl-top"><button class="iconbtn" data-pl="back" aria-label="Предыдущее упражнение"'+(P.si===0?" disabled":"")+'>'+ICON_BACK+'</button><div class="pl-prog"><div class="small muted num" style="margin-bottom:4px">Упражнение '+(P.si+1)+' из '+total+'</div><div class="bar"><i style="width:'+pct+'%"></i></div></div><button class="iconbtn" data-pl="exit" aria-label="Закончить тренировку">'+ICON_X+'</button></div>';
 if(P.exit){
  h+='<div class="card"><h3>Закончить тренировку?</h3><p class="small muted">Сделанное сохранится.</p><div class="row"><button class="btn grow" data-pl="exit-no">Продолжить</button><button class="btn primary grow" data-pl="exit-yes">Закончить</button></div></div>';
 }
 if(P.phase==="ring"){
  const nx=P.ringWhat==="rest"?(P.after==="nextEx"?EX[P.w.steps[P.si+1].id].n:"подход "+(P.set+1)):null;
  h+='<span class="pl-block">'+(P.ringWhat==="rest"?"Отдых закончился":"Время вышло")+'</span><div class="timer run">0</div><p class="target">'+(nx?"Дальше: <b>"+esc(nx)+"</b>":"<b>Стоп!</b> Подход сделан.")+'</p><div class="pl-actions"><button class="btn energy block" data-pl="ring-ok" style="min-height:64px;font-size:18px">Дальше</button></div></div>';
  root.innerHTML=h;return;
 }
 if(P.phase==="rest"){
  const nx=P.after==="nextEx"?P.w.steps[P.si+1]:s;const ne=EX[nx.id];
  h+='<span class="pl-block">Отдых</span><div class="timer rest" id="pl-time">'+fmtClock(remain())+'</div><p class="target muted">'+(P.after==="nextEx"?"Дальше: <b>"+esc(ne.n)+"</b>":"Дальше: подход "+(P.set+1)+" из "+s.sets)+'</p><canvas class="fig" '+figAttr(ne.pose,nx.gear)+'></canvas>'+(P.after==="nextEx"&&nx.gear?'<p class="target"><span class="pill acc">Приготовь: '+esc(nx.gear)+'</span></p>':'')+'<div class="pl-actions"><div class="row"><button class="btn" data-pl="rest-add">+15 с</button><button class="btn primary" data-pl="rest-skip">Пропустить отдых</button></div></div></div>';
  root.innerHTML=h;mountPl();return;
 }
 if(P.si===0&&P.set===1&&P.phase==="ready"&&P.w.notes.length)h+='<div class="note small">'+P.w.notes.map(esc).join("<br>")+'</div>';
 h+='<span class="pl-block">'+esc(blockName(s.block))+'</span><div class="pl-name">'+esc(e.n)+'</div>'+(s.gear?'<div><span class="pill acc" style="font-size:14px;padding:5px 12px">'+esc(s.gear)+'</span></div>':'')+'<canvas class="fig" '+figAttr(e.pose,s.gear)+'></canvas>';
 if(P.phase==="feedback"){
  h+='<div class="card"><h3>Как зашло?</h3><p class="small muted">Тренер подстроит повторы в следующий раз.</p><div class="chips"><button class="chip" data-pl="fb" data-v="easy">Легко</button><button class="chip" data-pl="fb" data-v="ok">Нормально</button><button class="chip" data-pl="fb" data-v="hard">Тяжело</button>'+(e.sh||e.alt?'<button class="chip" data-pl="fb" data-v="pain">Больно</button>':'')+'</div></div><div class="pl-actions"><button class="btn block" data-pl="fb" data-v="ok">Дальше</button></div></div>';
  root.innerHTML=h;mountPl();return;
 }
 h+=(s.sets>1?'<p class="target muted">Подход <b>'+P.set+'</b> из '+s.sets+'</p>'+dots(s):'');
 if(s.k==="reps"){
  h+='<div class="target"><div class="big num">'+s.val+'</div><div class="muted">'+plural(s.val,"повторение","повторения","повторений")+(s.sides>1?" на каждую сторону":"")+'</div></div>';
 } else if(P.phase==="ready"){
  h+='<div class="target"><div class="big num">'+fmtClock(s.val)+(s.val<60?" с":"")+'</div><div class="muted">'+(s.sides>1?"на каждую сторону":"держать")+'</div></div>';
 } else {
  const lbl=P.phase==="count"?"Приготовься":P.phase==="switch"?"Смена стороны":(s.sides>1?(P.side===0?"Первая сторона":"Вторая сторона"):"Держи");
  h+='<p class="target"><b>'+lbl+'</b></p><div class="timer '+(P.phase==="run"?"run":"")+'" id="pl-time">'+fmtClock(remain())+'</div>';
 }
 h+='<details class="card"><summary>Как делать</summary><ol class="how" style="margin-top:8px">'+e.how.map(function(x){return "<li>"+esc(x)+"</li>";}).join("")+'</ol>'+(e.tip?'<div class="note small" style="margin-top:8px">'+esc(e.tip)+'</div>':'')+'</details>';
 if(e.sh&&hasArea("shoulder"))h+='<div class="note red small">Плечо: без боли. Больно — уменьши амплитуду или пропусти.</div>';
 h+='<div class="pl-actions">';
 if(s.k==="reps")h+='<button class="btn primary block" data-pl="set-done">Сделал подход ✓</button>';
 else if(P.phase==="ready")h+='<button class="btn energy block" data-pl="go">Старт</button>';
 else h+='<button class="btn block" data-pl="stop-early">Готово раньше</button>';
 h+='<button class="btn ghost block" data-pl="skip">Пропустить упражнение</button></div></div>';
 root.innerHTML=h;mountPl();
}
function mountPl(){$("#player").querySelectorAll("canvas[data-pose]").forEach(function(c){mountFig(c,c.dataset.pose);});}
$("#player").addEventListener("click",function(ev){
 const b=ev.target.closest("[data-pl]");if(!b||!P)return;ensureAudio();
 const a=b.dataset.pl;
 switch(a){
  case "close":closePlayer();break;
  case "exit":P.exit=!P.exit;drawPlayer();break;
  case "exit-no":P.exit=false;drawPlayer();break;
  case "exit-yes":try{window.speechSynthesis&&window.speechSynthesis.cancel();}catch(e){}if(P.sets>0)finish();else closePlayer();break;
  case "back":goEx(P.si-1);break;
  case "skip":goEx(P.si+1);break;
  case "set-done":setDone();break;
  case "go":startTimer("count",3);break;
  case "ring-ok":{const w=P.ringWhat;P.ringWhat=null;if(w==="set")setDone();else afterRest();break;}
  case "stop-early":if(P.phase==="switch"){startRun();}else if(P.phase==="run"&&cur().sides>1&&P.side===0){P.side=1;startTimer("switch",5);}else{setDone();}break;
  case "rest-add":P.endAt+=15000;P.lastSec=null;break;
  case "rest-skip":afterRest();break;
  case "fb":{const s=cur();const v=b.dataset.v;P.feel[s.id]=v;K.applyFeedback(st,s.id,v);save();if(v==="pain"&&EX[s.id].alt)toast("Понял. В следующий раз будет «"+EX[EX[s.id].alt].n+"».");afterEx();break;}
 }
});

// ---------- in-app reminders ----------
function checkReminders(){
 if(P&&P.phase!=="ready")return;
 const plan=K.dayPlan(st);const now=new Date();const nm=K.nowMin(now);const k=today();
 plan.events.forEach(function(e){
  const id=k+e.key;if(fired[id])return;
  const diff=(nm-e.t+1440)%1440;
  if(diff<=1){fired[id]=1;
   if(e.kind==="meal"&&(st.meals[k]||{})[e.key])return;
   if(e.kind==="supp"&&(st.suppLog[k]||{})[e.sid])return;
   if(e.kind==="workout"&&doneToday().length)return;
   toast((e.kind==="workout"?"Пора тренироваться: ":e.kind==="water"?"Попей воды: ":"Напоминание: ")+e.label,true);
  }
 });
 // 30 minutes before workout
 const w=plan.events.find(function(e){return e.key==="workout";});
 if(w&&!doneToday().length){const id=k+"pre30";if(!fired[id]&&((w.t-nm+1440)%1440)===30){fired[id]=1;toast("Через 30 минут тренировка. Попей воды.",true);}}
}
setInterval(checkReminders,30000);
document.addEventListener("visibilitychange",function(){if(document.visibilityState==="visible"&&!P)render();});

window.__onBack=function(){
 if(!$("#sheet").hidden){closeSheet();return true;}
 if(P){if(P.phase==="done"){closePlayer();return true;}P.exit=true;drawPlayer();return true;}
 if(wz){if(wz.step>0){wzRead();save();wz.step--;drawWizard();}return true;}
 if(tab!=="today"){setTab("today");return true;}
 return false;
};
setTab("today");
if(NATIVE)setTimeout(syncReminders,800);
if(!st.profile.onboarded)openWizard();
initSync().then(function(){if(wz&&st.profile.onboarded){wz=null;$("#wizard").hidden=true;$("#wizard").innerHTML="";document.body.style.overflow="";render();}else if(!wz&&!st.profile.onboarded)openWizard();});
})();
</script>
